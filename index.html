<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="0">
<title>CHICHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== MODO DÍA ===== */
    --day-bg-1:#071521;
    --day-bg-2:#153b6e;
    --day-bg-3:#4fb7ff;
    --day-accent:#f0c74d;
    --day-text:#F5F9FF;
    --day-card: rgba(255,255,255,0.10);
    --day-card-border: rgba(255,255,255,0.22);
    --day-stage-1:#0a1d2f;
    --day-stage-2:#1f5ea8;
    --day-stage-3:#f0bf4d;

    /* ===== MODO NOCHE ===== */
    --night-bg-1:#04070d;
    --night-bg-2:#121827;
    --night-bg-3:#3f2d6e;
    --night-accent:#f4c84c;
    --night-accent-2:#7b5be8;
    --night-text:#ECECF1;
    --night-card: rgba(245,197,24,0.06);
    --night-card-border: rgba(245,197,24,0.28);
    --night-stage-1:#090d15;
    --night-stage-2:#231d41;
    --night-stage-3:#d9a833;

    --bg-1: var(--day-bg-1);
    --bg-2: var(--day-bg-2);
    --bg-3: var(--day-bg-3);
    --accent: var(--day-accent);
    --text: var(--day-text);
    --card: var(--day-card);
    --card-border: var(--day-card-border);
    --stage-1: var(--day-stage-1);
    --stage-2: var(--day-stage-2);
    --stage-3: var(--day-stage-3);

    --display-font: 'Press Start 2P', 'Courier New', monospace;
    --body-font: 'Press Start 2P', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    overflow-x:hidden;
    font-family: var(--body-font);
    background: radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg-1) 65%);
    color: var(--text);
    transition: background 0.9s ease, color 0.6s ease;
  }

  body.mode-night{
    --bg-1: var(--night-bg-1);
    --bg-2: var(--night-bg-2);
    --bg-3: var(--night-bg-3);
    --accent: var(--night-accent);
    --text: var(--night-text);
    --card: var(--night-card);
    --card-border: var(--night-card-border);
    --stage-1: var(--night-stage-1);
    --stage-2: var(--night-stage-2);
    --stage-3: var(--night-stage-3);
    --display-font: 'Press Start 2P', 'Courier New', monospace;
  }

  /* ============ SKYLINE DE FONDO (firma visual) ============ */
  .skyline{
    position: fixed;
    left:0; right:0; bottom:0;
    height: 26vh;
    min-height: 140px;
    z-index:0;
    pointer-events:none;
    opacity:0.9;
  }
  .skyline svg{ width:100%; height:100%; display:block; }
  .skyline .building{ fill: var(--bg-1); transition: fill 0.9s ease; }
  .skyline .window{ fill: var(--accent); opacity:0.55; transition: fill 0.9s ease, opacity 0.9s ease; }
  body.mode-night .skyline .window{ opacity:0.85; }

  .beam{
    position: fixed;
    bottom: 20vh;
    left: 12%;
    width: 2px;
    height: 0;
    background: linear-gradient(to top, rgba(245,197,24,0.35), transparent);
    transform-origin: bottom center;
    z-index:0;
    opacity:0;
    transition: opacity 1s ease;
    pointer-events:none;
  }
  body.mode-night .beam{
    opacity:1;
    animation: sweep 9s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{ height:65vh; transform: rotate(-18deg); }
    50%{ height:70vh; transform: rotate(14deg); }
    100%{ height:65vh; transform: rotate(-18deg); }
  }

  /* ============ PANTALLA DE INTRO ============ */
  #intro-screen{
    position: fixed; inset:0;
    z-index: 50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg-1) 65%);
    padding: 24px;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #intro-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  #start-btn{
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-weight: 400;
    font-size: clamp(0.68rem, 2.1vw, 0.9rem);
    line-height: 1.7;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 18px 24px;
    border-radius: 14px;
    border: 2px solid rgba(212, 179, 68, 0.9);
    background: linear-gradient(135deg, rgba(14, 15, 18, 0.95), rgba(24, 42, 68, 0.92), rgba(183, 138, 30, 0.88));
    color: #f9e7a4;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.8);
    box-shadow: 0 0 0 4px rgba(32, 39, 49, 0.7), 0 12px 26px rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    cursor:pointer;
    transition: transform 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease;
  }
  #start-btn:hover{
    transform: translateY(-2px) scale(1.01);
    filter: brightness(1.08);
    box-shadow: 0 0 0 4px rgba(32, 39, 49, 0.75), 0 14px 30px rgba(0,0,0,0.42);
  }
  #start-btn:active{ transform: translateY(0); }

  #intro-hint{
    margin-top: 18px;
    font-size: 0.85rem;
    opacity: 0.7;
    max-width: 320px;
  }

  #bday-message{
    display:none;
    font-family: var(--display-font);
    font-size: clamp(1.5rem, 5vw, 3rem);
    line-height:1.1;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(240,199,77,0.3);
    animation: pop-in 0.6s cubic-bezier(.2,.9,.25,1.2);
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    max-width: 90%;
    z-index: 25;
  }
  #bday-message span{ display:block; font-size:0.4em; font-family: var(--body-font); font-weight:600; color: var(--text); margin-top:10px; }

  @keyframes pop-in{
    0%{ opacity:0; transform: scale(0.85); }
    100%{ opacity:1; transform: scale(1); }
  }

  /* ============ PÁGINA PRINCIPAL ============ */
  #main-page{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 28px 20px 60px;
    opacity:0;
    transition: opacity 0.9s ease;
  }
  #main-page.visible{ opacity:1; }
  #main-page[hidden]{ display:none; }

  header.page-header{
    text-align:center;
    margin-bottom: 22px;
  }
  header.page-header h1{
    font-family: var(--display-font);
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  body.mode-night header.page-header h1{ letter-spacing:0.04em; }
  header.page-header p{
    margin-top:8px;
    font-size:0.95rem;
    opacity:0.75;
    font-weight:500;
  }

  /* ---- Selector Día / Noche (elemento firma: switch tipo pastilla) ---- */
  .mode-toggle{
    position: relative;
    width: 128px; height: 66px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    margin: 6px 0 14px;
    padding: 0;
    background: linear-gradient(135deg, #8FCBF7, #4FA6E8);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.15), 0 6px 18px rgba(63,143,217,0.35);
    transition: background 0.6s ease, box-shadow 0.6s ease;
    overflow: hidden;
  }
  body.mode-night .mode-toggle{
    background: linear-gradient(135deg, #0B0E1F, #171A33);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 0 26px rgba(245,197,24,0.22);
  }

  /* nubecita / estrellas de fondo dentro del switch */
  .switch-deco{
    position:absolute; inset:0;
    overflow:hidden;
  }
  .switch-deco .cloud{
    position:absolute; right:16px; bottom:10px;
    width:26px; height:26px;
    opacity:1;
    transition: opacity 0.4s ease;
  }
  .switch-deco .stars{
    position:absolute; left:14px; top:0; bottom:0;
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    opacity:0;
    transition: opacity 0.4s ease;
  }
  .switch-deco .stars span{
    width:4px; height:4px; border-radius:50%;
    background:#cda100;
    box-shadow: 10px 14px 0 -1px #F5C518, -6px -10px 0 -1.5px #cba001;
  }
  body.mode-night .switch-deco .cloud{ opacity:0; }
  body.mode-night .switch-deco .stars{ opacity:1; }

  .switch-icon{
    position:absolute;
    top:50%; right:44px;
    transform: translateY(-50%);
    width:22px; height:22px;
    color:#ce9505;
    opacity:1;
    transition: opacity 0.4s ease, left 0.4s ease, right 0.4s ease;
  }
  .switch-icon.bat{
    right:auto; left:44px;
    color:#c59a00;
    opacity:0;
  }
  body.mode-night .switch-icon.sun{ opacity:0; }
  body.mode-night .switch-icon.bat{ opacity:1; }

  .switch-knob{
    position:absolute;
    top:5px; left:5px;
    width:56px; height:56px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #d7dce3 75%);
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    transition: transform 0.45s cubic-bezier(.34,1.35,.64,1);
  }
  body.mode-night .switch-knob{
    transform: translateX(62px);
    background: radial-gradient(circle at 35% 30%, #f3f3f3, #c7c9cf 75%);
  }

  .mode-label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    opacity:0.65;
    margin-top:-16px;
    margin-bottom:22px;
  }

  /* ---- Escenario de video ---- */
  .stage{
    position:relative;
    width: min(80vw, 430px);
    height: min(75vh, 760px);
    max-height: 760px;
    aspect-ratio: 9 / 16;
    border-radius: 28px;
    overflow:hidden;
    background: radial-gradient(circle at center, rgba(14, 18, 24, 0.9), rgba(0,0,0,1) 75%);
    border: 2px solid rgba(214, 165, 58, 0.85);
    box-shadow: 0 0 0 4px rgba(10,14,22,0.8), 0 24px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08);
    transition: background 0.7s ease, border-color 0.7s ease;
  }

  .stage::before,
  .stage::after{
    content:"";
    position:absolute;
    inset: 0;
    pointer-events:none;
    z-index: 12;
  }

  .stage::before{
    background:
      linear-gradient(to right, rgba(0,0,0,0.82), rgba(0,0,0,0.08) 8%, rgba(0,0,0,0.08) 92%, rgba(0,0,0,0.82)),
      linear-gradient(to bottom, rgba(0,0,0,0.78), rgba(0,0,0,0.06) 8%, rgba(0,0,0,0.06) 92%, rgba(0,0,0,0.78));
    mix-blend-mode: multiply;
  }

  .stage::after{
    inset: 14px;
    border-radius: 20px;
    border: 1px solid rgba(212, 179, 68, 0.5);
    box-shadow: inset 0 0 22px rgba(255, 205, 72, 0.12), 0 0 24px rgba(255, 205, 72, 0.08);
    animation: filmGlow 3.5s ease-in-out infinite alternate;
  }

  @keyframes filmGlow{
    0%{ box-shadow: inset 0 0 18px rgba(255, 205, 72, 0.10), 0 0 0 rgba(212,179,68,0.2); }
    100%{ box-shadow: inset 0 0 28px rgba(255, 205, 72, 0.18), 0 0 20px rgba(212,179,68,0.12); }
  }

  .stage-video-shell{
    position:absolute;
    inset:0;
    overflow:hidden;
    border-radius: 28px;
    z-index: 0;
  }

  .video-glow{
    position:absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(135deg, rgba(25, 90, 140, 0.35), rgba(255, 200, 84, 0.15), rgba(0,0,0,0.28));
    pointer-events:none;
  }

  body.mode-night .video-glow{
    background: linear-gradient(135deg, rgba(22, 14, 35, 0.45), rgba(244, 200, 76, 0.10), rgba(0,0,0,0.35));
  }

  .rotate-wrapper{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.4s ease;
    padding: 18px 14px;
    z-index: 3;
  }

  /* En celulares con video vertical, no forzamos rotación ni pantalla horizontal */
  .rotate-wrapper.force-landscape{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform: none;
    z-index: 1;
    background:#000;
  }

  .video-el{
    position:absolute; inset: 18px 14px;
    width: calc(100% - 28px);
    height: calc(100% - 36px);
    object-fit: contain;
    object-position: center center;
    background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(12,16,22,0.84));
    border-radius: 12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.5s ease, transform 0.4s ease, background 0.7s ease;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
  }
  .video-el.active{ opacity:1; pointer-events:auto; }

  .bg-video{
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    filter: blur(18px) brightness(0.55) saturate(1.2) contrast(1.1);
    transform: scale(1.25);
    object-fit: cover;
    background: linear-gradient(135deg, rgba(11, 29, 43, 0.9), rgba(0,0,0,0.9));
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .bg-video.active{ opacity: 1; }

  .front-video{ z-index: 3; }

  .video-overlay{
    position:absolute;
    left:12px; right:12px; bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    z-index:50;
    pointer-events:none;
  }
  .video-btn{
    pointer-events:auto;
    border:none;
    border-radius:10px;
    background: rgba(10,10,12,0.7);
    color:#f8d76a;
    border:1px solid rgba(248,215,106,0.55);
    box-shadow: 0 0 12px rgba(248,215,106,0.18);
    font-family: var(--body-font);
    font-size:0.7rem;
    padding:8px 12px;
    cursor:pointer;
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  .video-btn:hover{ transform: translateY(-1px); filter: brightness(1.1); }
  .play-btn{ min-width: 52px; }
  .full-btn, .sound-btn{ min-width: 58px; }

  #rotate-hint{
    position: fixed; inset:0;
    z-index: 60;
    background: rgba(0,0,0,0.85);
    color:#fff;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    gap:14px;
    padding:24px;
  }
  #rotate-hint.show{ display:flex; }
  #rotate-hint svg{ width:56px; height:56px; animation: rotate-icon 1.6s ease-in-out infinite; }
  @keyframes rotate-icon{
    0%,100%{ transform: rotate(0deg); }
    50%{ transform: rotate(-90deg); }
  }
  #rotate-hint button{
    margin-top:6px;
    background: transparent;
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    padding:8px 16px;
    border-radius:999px;
    font-size:0.8rem;
    cursor:pointer;
  }

  footer.note{
    margin-top: 28px;
    font-size:0.72rem;
    opacity:0.5;
    max-width: 500px;
    text-align:center;
  }

  @media (max-width: 640px){
    #main-page{
      padding: 18px 14px 32px;
    }

    header.page-header h1{
      font-size: clamp(1.2rem, 6vw, 2rem);
    }

    .mode-toggle{ width:110px; height:56px; }
    .switch-knob{ width:46px; height:46px; }
    body.mode-night .switch-knob{ transform: translateX(54px); }
    .switch-icon{ width:18px; height:18px; }
    .switch-icon.sun{ right:36px; }
    .switch-icon.bat{ left:36px; }

    .stage{ width: min(86vw, 390px); height: min(70vh, 700px); border-radius: 18px; }
    .rotate-wrapper{ padding: 12px 10px; }
    .video-el{ inset: 12px 10px; width: calc(100% - 20px); height: calc(100% - 24px); }
    .video-overlay{ left:8px; right:8px; bottom:10px; }
    .video-btn{ font-size:0.62rem; padding:7px 10px; }
    .play-btn{ min-width: 46px; }
    .full-btn, .sound-btn{ min-width: 50px; }
  }

  /* ============ ESTILO ARCADE RETRO (INTRO Y MAIN PAGE) ============ */
  .arcade-ground{
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    overflow: hidden;
    z-index: 10;
  }

  .ground-shine{
    position: absolute;
    bottom: 45px; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(to right, transparent, #f0c74d, #f0c74d, #f0c74d, transparent);
    box-shadow: 0 0 12px #f0c74d, 0 0 24px rgba(240,199,77,0.5);
    animation: pulse-glow 1.5s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%, 100%{ opacity: 0.6; }
    50%{ opacity: 1; }
  }

  .terrain-zigzag{
    position: absolute;
    bottom: 50px; left: 0; right: 0;
    width: 100%;
    height: 60px;
    animation: none;
  }

  @keyframes scroll-terrain{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-50%); }
  }

  .batmobile{
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 240px;
    height: 45px;
  }

  .batmobile-body{
    width: 100%;
    height: 100%;
    position: relative;
    animation: bounce-idle 0.8s ease-in-out infinite;
  }

  @keyframes bounce-idle{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  .speed-trail{
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 30px;
    background: linear-gradient(to right, #ff3300, #ff9900, transparent);
    opacity: 0;
    animation: speed-burst 0.6s ease-out forwards;
  }

  @keyframes speed-burst{
    0%{ opacity: 1; right: -8px; }
    100%{ opacity: 0; right: -30px; }
  }

  .speed-spark{
    position: absolute;
    right: -4px;
    width: 2px;
    height: 2px;
    background: #f0c74d;
    opacity: 0;
  }

  .speed-spark.active{
    animation: spark-fly 0.8s ease-out forwards;
  }

  @keyframes spark-fly{
    0%{ opacity: 1; right: -4px; top: 20px; }
    100%{ opacity: 0; right: -40px; top: 35px; }
  }

  /* Intro con arcade */
  #intro-screen.arcade-mode{
    background: linear-gradient(180deg, #0a1e3f 0%, #153b6e 50%, #0a1e3f 100%);
    justify-content: center;
    align-items: center;
    padding: 0;
    min-height: 100vh;
    flex-direction: column;
  }

  #intro-screen.arcade-mode #start-btn{
    position: relative;
    z-index: 30;
    font-size: clamp(0.7rem, 3vw, 1rem);
    padding: 16px 28px;
    border: 3px solid #f0c74d;
    background: linear-gradient(135deg, #000000, #1a2a3f, #000000);
    color: #f9e7a4;
    text-shadow: 0 0 12px #f0c74d, 2px 2px 0 rgba(0, 0, 0, 0.8);
    box-shadow: 0 0 0 3px rgba(240,199,77,0.3), 0 0 25px rgba(240,199,77,0.4), inset 0 0 10px rgba(240,199,77,0.1);
    transition: all 0.3s ease;
    cursor: pointer;
    order: -1;
    margin-bottom: 30px;
  }

  #intro-screen.arcade-mode #start-btn:hover{
    box-shadow: 0 0 0 3px rgba(240,199,77,0.6), 0 0 35px rgba(240,199,77,0.7), inset 0 0 15px rgba(240,199,77,0.2);
    text-shadow: 0 0 16px #f0c74d, 0 0 24px #f0c74d, 2px 2px 0 rgba(0, 0, 0, 0.8);
    transform: translateY(-2px);
  }

  #intro-screen.arcade-mode #start-btn:hover{
    box-shadow: 0 0 0 3px rgba(240,199,77,0.6), 0 0 35px rgba(240,199,77,0.7), inset 0 0 15px rgba(240,199,77,0.2);
    text-shadow: 0 0 16px #f0c74d, 0 0 24px #f0c74d, 2px 2px 0 rgba(0, 0, 0, 0.8);
    transform: translateY(-2px);
  }

  @media (max-width: 768px){
    .batmobile{ width: 180px; height: 36px; }
    .arcade-ground{ height: 100px; }
    .terrain-zigzag{ height: 50px; }
    .ground-shine{ bottom: 40px; height: 2px; }
    .batmobile{ bottom: 45px; }
    
    #intro-screen.arcade-mode{
      padding: 0;
      justify-content: center;
    }
    
    #intro-screen.arcade-mode #start-btn{
      margin-bottom: 40px;
      padding: 12px 20px;
      font-size: clamp(0.65rem, 2.5vw, 0.9rem);
    }
    
    #bday-message{
      font-size: clamp(1.2rem, 4vw, 2rem);
      top: 25%;
      display: none;
    }
  }
  
  @media (max-width: 480px){
    .batmobile{ width: 120px; height: 28px; }
    .arcade-ground{ height: 90px; }
    .terrain-zigzag{ height: 45px; bottom: 45px; }
    .ground-shine{ bottom: 38px; height: 2px; box-shadow: 0 0 8px #f0c74d, 0 0 16px rgba(240,199,77,0.5); }

<script>
  // ---------- 1. INTRO: sonido + mensaje (máx. 5s) ----------
  const startBtn   = document.getElementById('start-btn');
  const introHint  = document.getElementById('intro-hint');
  const bdayMsg    = document.getElementById('bday-message');
  const introScreen= document.getElementById('intro-screen');
  const mainPage   = document.getElementById('main-page');
  const audio      = document.getElementById('bday-audio');

  startBtn.addEventListener('click', () => {
    startBtn.style.display = 'none';
    introHint.style.display = 'none';
    bdayMsg.style.display = 'block';

    audio.currentTime = 0;
    audio.play().catch(() => { /* si el navegador bloquea audio, seguimos igual */ });

    const MAX_MS = 5000;
    let finished = false;

    function goToMain(){
      if (finished) return;
      finished = true;
      introScreen.classList.add('hidden');
      mainPage.hidden = false;
      requestAnimationFrame(() => mainPage.classList.add('visible'));
      setTimeout(() => { audio.pause(); }, 400);
    }

    audio.addEventListener('ended', goToMain, { once: true });
    setTimeout(goToMain, MAX_MS);
  });

  // ---------- ARCADE: Efectos de velocidad (chispas del Batimóvil) ----------
  function createSpeedEffects(){
    const speedContainer = document.getElementById('speed-effects');
    if (!speedContainer) return;
    
    setInterval(() => {
      const spark = document.createElement('div');
      spark.className = 'speed-spark active';
      spark.style.top = (20 + Math.random() * 20) + 'px';
      speedContainer.appendChild(spark);
      
      setTimeout(() => spark.remove(), 800);
    }, 300);
  }

  if (document.getElementById('speed-effects')) {
    createSpeedEffects();
  }

  // ---------- 2. TOGGLE DÍA / NOCHE ----------
  const modeToggle = document.getElementById('modeToggle');
  const modeLabel  = document.getElementById('modeLabel');
  const dayVideo   = document.getElementById('dayVideo');
  const nightVideo = document.getElementById('nightVideo');
  const dayVideoBg = document.getElementById('dayVideoBg');
  const nightVideoBg = document.getElementById('nightVideoBg');

  function setVideoMode(goingNight){
    const activeVideo = goingNight ? nightVideo : dayVideo;
    const inactiveVideo = goingNight ? dayVideo : nightVideo;
    const activeBgVideo = goingNight ? nightVideoBg : dayVideoBg;
    const inactiveBgVideo = goingNight ? dayVideoBg : nightVideoBg;

    inactiveVideo.pause();
    inactiveBgVideo.pause();
    inactiveVideo.classList.remove('active');
    inactiveBgVideo.classList.remove('active');

    activeVideo.classList.add('active');
    activeBgVideo.classList.add('active');

    activeVideo.muted = false;
    activeBgVideo.muted = true;
    activeVideo.loop = true;
    activeBgVideo.loop = true;

    activeVideo.play().catch(() => {});
    activeBgVideo.play().catch(() => {});
  }

  modeToggle.addEventListener('click', () => {
    const goingNight = !document.body.classList.contains('mode-night');
    document.body.classList.toggle('mode-night', goingNight);
    modeToggle.setAttribute('aria-pressed', String(goingNight));
    modeLabel.textContent = goingNight ? 'Modo noche' : 'Modo día';

    setVideoMode(goingNight);
  });

  setVideoMode(false);

  // ---------- 3. ADAPTACIÓN MÓVIL: forzar horizontal ----------
  const rotateWrapper = document.getElementById('rotateWrapper');
  const rotateHint    = document.getElementById('rotate-hint');
  const dismissHint   = document.getElementById('dismissHint');
  let hintDismissed = false;

  function isMobileDevice(){
    return window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 900;
  }

  function updateOrientationState(){
    rotateWrapper.classList.remove('force-landscape');
    rotateHint.classList.remove('show');
  }

  dismissHint.addEventListener('click', () => {
    hintDismissed = true;
    rotateHint.classList.remove('show');
    rotateWrapper.classList.remove('force-landscape');
  });

  window.addEventListener('resize', updateOrientationState);
  window.addEventListener('orientationchange', updateOrientationState);
  updateOrientationState();

  // ---------- 4. CONTROLES PERSONALIZADOS DEL VIDEO ----------
  const playBtn = document.querySelector('.play-btn');
  const soundBtn = document.querySelector('.sound-btn');
  const fullBtn = document.querySelector('.full-btn');
  const activeVideo = () => document.querySelector('.front-video.active');

  function updateSoundButton(video){
    if (!video) return;
    soundBtn.textContent = video.muted ? '🔇' : '🔊';
  }

  function toggleVideoPlay(){
    const video = activeVideo();
    if (!video) return;

    if (video.paused) {
      video.muted = false;
      video.play().catch(() => {});
      playBtn.textContent = '❚❚';
      updateSoundButton(video);
    } else {
      video.pause();
      playBtn.textContent = '▶';
    }
  }

  function toggleVideoSound(){
    const video = activeVideo();
    if (!video) return;
    video.muted = !video.muted;
    updateSoundButton(video);
  }

  playBtn.addEventListener('click', toggleVideoPlay);
  soundBtn.addEventListener('click', toggleVideoSound);

  fullBtn.addEventListener('click', () => {
    const video = activeVideo();
    if (!video) return;
    const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
    if (req) req.call(video);
  });

  dayVideo.addEventListener('play', () => { playBtn.textContent = '❚❚'; updateSoundButton(dayVideo); });
  dayVideo.addEventListener('pause', () => { if (dayVideo.classList.contains('active')) playBtn.textContent = '▶'; });
  nightVideo.addEventListener('play', () => { playBtn.textContent = '❚❚'; updateSoundButton(nightVideo); });
  nightVideo.addEventListener('pause', () => { if (nightVideo.classList.contains('active')) playBtn.textContent = '▶'; });

  updateSoundButton(dayVideo);
  soundBtn.textContent = '🔊';
</script>
